<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>durov.dog</title>
<meta name="description" content="durov.dog — parody memecoin. Not affiliated with any person, company or messenger.">
<link rel="icon" href="dog.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:#000;
    color:#fff;
    min-height:100vh;
    font-family:"IBM Plex Mono",monospace;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  main{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    gap:22px;
    text-align:center;
  }
  .dog{
    max-width:min(360px,72vw);
    width:100%;
    height:auto;
    filter:drop-shadow(0 0 60px rgba(255,255,255,.06));
    user-select:none;
    -webkit-user-drag:none;
  }
  h1{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:clamp(52px,13vw,132px);
    letter-spacing:-.04em;
    line-height:.9;
  }
  .tagline{
    font-size:13px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:#666;
  }
  footer{
    position:fixed;
    bottom:16px;
    left:0;right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:#333;
  }

</head>
<body>
<main>
  <img class="dog" src="dog.png" alt="durov.dog mascot — grumpy buff dog in a cap">
